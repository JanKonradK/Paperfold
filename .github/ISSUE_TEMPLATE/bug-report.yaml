name: Bug report
description: Report a bug!|我遇到了问题！
title: "[Bug]: "
labels: ["bug"]

body:
  - type: checkboxes
    id: bug_report_is_crash
    attributes:
      label: Prerequisites|前提条件
      options:
        - label: I have searched for similar issues and did not find any|我已经搜索过没有相同的问题
          required: true
  - type: input
    id: bug_report_version
    attributes:
      label: Paperfold version/build|Paperfold 版本及构建号
      placeholder: 2.1.0+210
    validations:
      required: true
  - type: input
    id: bug_report_device_os
    attributes:
      label: Device and OS version|设备及操作系统版本
      placeholder: Samsung Galaxy S23 Ultra, Android 16
  - type: dropdown
    id: bug_report_book_source
    attributes:
      label: How the book was added|书籍添加方式
      options:
        - Imported file|导入文件
        - Shared from another app|从其他应用分享
        - OPDS/online source|OPDS 或在线来源
        - Physical book with a photo cover|带照片封面的纸质书
        - WebDAV sync|WebDAV 同步
        - Other|其他
  - type: textarea
    id: bug_report_description
    attributes:
      label: Describe the bug|描述问题
      description: |
        A clear and concise description of what the bug is
        一个清晰且简洁的描述问题
    validations:
      required: true
  - type: textarea
    id: bug_report_reproduce
    attributes:
      label: To reproduce|重现步骤
      description: |
        Steps to reproduce the behavior
        如何重现问题
      value: |
        1. Go to '...' | 前往...
        2. Click on '...' | 点击...
        3. Scroll down to '...' | 向下滚动到...
        4. See error | 看到错误
    validations:
      required: true
  - type: textarea
    id: bug_report_expected_behavior
    attributes:
      label: Expected behavior|预期行为
      description: |
        A clear and concise description of what you expected to happen
        一个清晰且简洁的描述你期望发生的事情
    validations:
      required: true
  - type: textarea
    id: bug_report_screenshots
    attributes:
      label: Screenshots|截图
      description: |
        If applicable, add screenshots to help explain your problem
        Tip: You can attach images by clicking this area to highlight it and then dragging files in.
        如果可以，添加截图以帮助解释问题
        提示：你可以通过点击此区域来高亮它，然后拖动文件来添加图片。
  - type: textarea
    id: bug_report_desktop
    attributes:
      label: Platform (please complete the following information)|平台（请填写以下信息）
      value: |
        - Platform: | 平台：
          [e.g. Android]
        - OS: | 操作系统：
          [e.g. Android13(MIUI14)]
        - Paperfold Version:
          [e.g. 1.2.0+2033]
        - Device: | 设备：
          [e.g. Xiaomi 13]
    validations:
      required: true
  - type: textarea
    id: bug_report_logs
    attributes:
      label: Logs|日志
      description: Remove personal data, passwords, and access tokens before you attach logs.|附加日志前，请删除个人数据、密码和访问令牌。
      render: text
  - type: textarea
    id: bug_report_additional_context
    attributes:
      label: Additional context|其他信息
      description: |
        Add any other context about the problem here, e.g. logs
        添加任何其他关于问题的信息，如日志等
