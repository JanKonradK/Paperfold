name: Build Android

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      flutter_version:
        required: true
        type: string
    secrets:
      KEYSTORE_BASE64:
        required: true
      KEYSTORE_PASSWORD:
        required: true
      KEY_PASSWORD:
        required: true
      KEY_ALIAS:
        required: true

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version }}

      - name: Get Dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
          check-latest: true

      - name: Setup Android signing
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks        
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties    
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties    
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties    
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: Build for Android
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          flutter test --concurrency=1
          flutter build apk --release
          flutter build apk --split-per-abi

      - name: Rename builds
        run: |
          cd build/app/outputs/flutter-apk
          mv app-armeabi-v7a-release.apk Paperfold-android-${{ inputs.version }}-armeabi-v7a.apk
          mv app-arm64-v8a-release.apk Paperfold-android-${{ inputs.version }}-arm64-v8a.apk
          mv app-x86_64-release.apk Paperfold-android-${{ inputs.version }}-x86_64.apk
          mv app-release.apk Paperfold-android-${{ inputs.version }}-universal.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-artifacts
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
