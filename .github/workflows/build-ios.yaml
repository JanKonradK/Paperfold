name: Build iOS

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      flutter_version:
        required: true
        type: string
      xcode_version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-26
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version }}

      - name: Get Dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Build for iOS
        run: |
          sudo xcode-select -switch /Applications/Xcode_${{ inputs.xcode_version }}.app/Contents/Developer
          # xcodebuild -downloadPlatform iOS -buildVersion 18.2
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          flutter build ios --release --no-codesign
          cd build/ios/Release-iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Paperfold-ios-${{ inputs.version }}-unsigned.zip Payload
          cp Paperfold-ios-${{ inputs.version }}-unsigned.zip Paperfold-ios-${{ inputs.version }}-unsigned.ipa
          mkdir -p ../../ios
          cp Paperfold-ios-${{ inputs.version }}-unsigned.ipa ../../ios/
          cp Paperfold-ios-${{ inputs.version }}-unsigned.zip ../../ios/

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-artifacts
          path: |
            build/ios/*.ipa
            build/ios/*.zip
          if-no-files-found: error
