name: Build macOS

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      flutter_version:
        required: true
        type: string
      xcode_version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version }}

      - name: Get Dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Prepare for macOS
        shell: bash
        run: flutter config --enable-macos-desktop

      - name: Build for macOS
        shell: bash
        run: |
          sudo xcode-select -switch /Applications/Xcode_${{ inputs.xcode_version }}.app/Contents/Developer
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          chmod +x ./scripts/macos_nosign.sh
          ./scripts/macos_nosign.sh
          flutter build macos
          cd build/macos/Build/Products/Release
          mkdir -p "Paperfold"
          cp -r "Paperfold.app" "Paperfold/Paperfold.app"
          ln -s /Applications "Paperfold/Applications"
          hdiutil create -volname "Paperfold" -srcfolder "Paperfold" -ov -format UDZO Paperfold-${{ inputs.version }}.dmg
          ditto -c -k --keepParent "Paperfold.app" "Paperfold-${{ inputs.version }}.zip"

      - name: Rename builds
        run: |
          cd build
          mkdir -p macos
          mv macos/Build/Products/Release/Paperfold-${{ inputs.version }}.dmg macos/Paperfold-macos-${{ inputs.version }}.dmg
          mv macos/Build/Products/Release/Paperfold-${{ inputs.version }}.zip macos/Paperfold-macos-${{ inputs.version }}.zip
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-artifacts
          path: |
            build/macos/*.dmg
            build/macos/*.zip
          if-no-files-found: error
