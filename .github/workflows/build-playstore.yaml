name: Build for Play Store

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      flutter_version:
        required: true
        type: string
      is_alpha:
        required: true
        type: string
      is_beta:
        required: true
        type: string
    secrets:
      PLAY_STORE_JSON_KEY:
        required: true
      KEYSTORE_BASE64:
        required: true
      KEYSTORE_PASSWORD:
        required: true
      KEY_PASSWORD:
        required: true
      KEY_ALIAS:
        required: true

permissions:
  contents: read

jobs:
  build-playstore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TRACK: internal
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Decide Play track
        run: |
          if [[ "${{ inputs.is_alpha }}" == "true" ]]; then
            echo "TRACK=internal" >> $GITHUB_ENV
          elif [[ "${{ inputs.is_beta }}" == "true" ]]; then
            echo "TRACK=alpha" >> $GITHUB_ENV
          else
            echo "TRACK=alpha" >> $GITHUB_ENV
          fi

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
          check-latest: true

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '2.7'
          bundler-cache: true
          working-directory: android

      - name: Setup Android signing
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks        
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties    
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties    
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties    
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: Setup Play Store service account
        run: echo "${{ secrets.PLAY_STORE_JSON_KEY }}" | base64 --decode > google_service_account.json

      - name: Get Dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Build and Release to Play Store
        run: |
          cd android
          bundle install --path vendor/bundle
          bundle exec fastlane android release_play_store track:${TRACK}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_PATH: google_service_account.json
