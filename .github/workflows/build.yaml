name: Build & Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*-beta.[0-9]*'

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      flutter_version: ${{ steps.version.outputs.flutter_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PUBSPEC_VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d '+' -f 1)
          test "$VERSION" = "$PUBSPEC_VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "flutter_version=$(tr -d '[:space:]' < .github/flutter-version)" >> "$GITHUB_OUTPUT"

  build-android:
    needs: setup
    uses: ./.github/workflows/build-android.yaml
    with:
      version: ${{ needs.setup.outputs.version }}
      flutter_version: ${{ needs.setup.outputs.flutter_version }}
    secrets:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

  release:
    needs: [setup, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: artifacts
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE_VERSION="${VERSION%%-*}"
          awk -v heading="## $BASE_VERSION" '
            $0 == heading { found=1; next }
            found && /^## / { exit }
            found { print }
          ' assets/CHANGELOG.md > release-notes.md
          test -s release-notes.md
          FLAGS=()
          if [[ "$VERSION" == *-beta.* ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" artifacts/*.apk \
            --verify-tag --title "Paperfold $VERSION" \
            --notes-file release-notes.md "${FLAGS[@]}"
