name: PR Check

on:
  pull_request: {}
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to test
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  # `assets/foliate-js/dist/` is a committed build artifact and it is what the
  # WebView loads. Nothing in the Flutter build produces it, so a change under
  # `src/` that is not rebuilt and committed alongside simply never runs. That
  # is not hypothetical: between 2026-04-19 and 2026-08-13 every reader change
  # Paperfold made sat in `src/` and never reached a device, including a whole
  # measured page-turn performance pass. See docs/paperfold/reader-stutter.md.
  reader-bundle:
    name: Reader bundle is current
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout pull request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' }}
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/merge

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: assets/foliate-js/package-lock.json

      - name: Install reader dependencies
        working-directory: assets/foliate-js
        run: npm ci

      - name: Test the reader
        working-directory: assets/foliate-js
        run: npm test

      - name: Rebuild the bundle
        working-directory: assets/foliate-js
        run: npm run build

      - name: Fail if the committed bundle is stale
        run: |
          if ! git diff --exit-code -- assets/foliate-js/dist/; then
            echo "::error::assets/foliate-js/dist/ is out of date with src/."
            echo "The WebView loads dist/, so these changes would never run."
            echo "Run 'npm run build' in assets/foliate-js and commit dist/."
            exit 1
          fi

  test:
    name: Flutter Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Flutter version
        id: flutter_version
        run: |
          VERSION=$(tr -d '[:space:]' < .github/flutter-version)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Flutter version: ${VERSION}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          cache: true

      - name: Verify Flutter version
        run: flutter --version | grep "Flutter ${{ steps.flutter_version.outputs.version }}"

      - name: Checkout pull request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' }}
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/merge

      - name: Get dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test
