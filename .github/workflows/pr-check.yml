name: PR Check

on:
  pull_request: {}
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to test
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Flutter Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Flutter version
        id: flutter_version
        run: |
          VERSION=$(tr -d '[:space:]' < .github/flutter-version)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Flutter version: ${VERSION}"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          cache: true

      - name: Verify Flutter version
        run: flutter --version | grep "Flutter ${{ steps.flutter_version.outputs.version }}"

      - name: Checkout pull request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/pull/${{ inputs.pr_number }}/merge

      - name: Get dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Set up reader build tools
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: assets/foliate-js/package-lock.json

      - name: Build reader
        working-directory: assets/foliate-js
        run: |
          npm ci --no-fund
          npm run build

      - name: Generate localization
        run: flutter gen-l10n

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test --concurrency=1
