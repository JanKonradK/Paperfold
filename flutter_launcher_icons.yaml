# Paperfold application icons.
#
# The three master files come from `tool/generate_app_icons.dart`. Do not edit
# them by hand, and do not point this file at hand-made artwork: the icon is a
# widget so that it keeps the cover colours and the wreath the application
# already uses.
#
#   flutter test tool/generate_app_icons.dart
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "tool/icon/paperfold_icon.png"

  android: "ic_launcher"
  min_sdk_android: 21
  # Cover Burgundy and Foil Gold. PaperfoldTokens.cover holds the same pair.
  adaptive_icon_background: "#4A1528"
  adaptive_icon_foreground: "tool/icon/paperfold_icon_foreground.png"
  adaptive_icon_monochrome: "tool/icon/paperfold_icon_monochrome.png"

  ios: true
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "tool/icon/paperfold_icon.png"
    background_color: "#4A1528"
    theme_color: "#4A1528"

  windows:
    generate: true
    image_path: "tool/icon/paperfold_icon.png"
    icon_size: 256

  macos:
    generate: true
    image_path: "tool/icon/paperfold_icon.png"
