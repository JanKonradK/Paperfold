name: paperfold
description: "Paperfold is a reading journal, reader, and note application."
publish_to: 'none'

version: 1.15.0+6324

environment:
  sdk: '>=3.5.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  flutter_shaders: ^0.1.3
  flutter_svg: ^2.0.17
  file_picker: ^9.0.2
  path_provider: ^2.1.2
  image: ^4.3.0
  sqflite: ^2.3.2
  path: ^1.9.0
  shared_preferences: ^2.2.2
  provider: ^6.1.2
  flutter_gen_runner: ^5.4.0
  intl: 0.20.2
  flutter_colorpicker: ^1.0.3
  html: ^0.15.4
  # OPDS 1.2 feeds are Atom XML. html parses HTML, not namespaced XML, and the
  # OPDS extensions live in their own namespaces. plan.md Section 9.
  xml: ^6.5.0
  # OPDS catalog passwords go to the platform keystore, never to SQLite. These
  # are the reader's own server passwords. plan.md Section 9.2.
  flutter_secure_storage: ^9.2.4
  flutter_html: ^3.0.0-beta.2
  archive: ^3.6.1
  flutter_inappwebview:
    git:
      url: https://github.com/Anxcye/flutter_inappwebview.git
      ref: 4a275c3
      path: flutter_inappwebview
  shelf: ^1.4.1
  fl_chart: ^0.70.2
  flutter_rating_bar: ^4.0.1
  permission_handler: ^11.3.1
  webdav_client:
    git:
      url: https://github.com/Anxcye/webdav_client.git
      # Pinned 2026-08-10. Without a ref this tracks the default branch of a
      # single-maintainer fork, so the build is not reproducible.
      ref: 3c6d0eb21baf593d8a0a10ba039b0b73ce891ad6
  fluttertoast: ^8.2.6
  dio: ^5.4.3+1
  pubspec_parse: ^1.2.3
  logging: ^1.2.0
  flutter_file_dialog: ^3.0.2
  contentsize_tabbarview:
    git:
      url: https://github.com/Anxcye/contentsize_tabbarview.git
      ref: feat/animation
  wakelock_plus: ^1.2.5
  icons_plus: ^5.0.0
  url_launcher: ^6.2.6
  sqflite_common_ffi: ^2.3.3
  battery_plus: ^6.2.1
  sticky_headers: ^0.3.0+2
  photo_view: ^0.15.0
  flutter_smart_dialog: ^4.9.8+1
  saver_gallery: ^4.0.1
  share_plus: ^11.1.0
  device_info_plus: ^11.3.2
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  chinese_font_library: ^1.2.0
  flex_color_scheme: ^8.3.0
  sqlite3_flutter_libs: ^0.5.26
  flutter_reorderable_grid_view: ^5.4.0
  uuid: ^4.5.1
  desktop_drop: ^0.5.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  flutter_heatmap_calendar:
    git:
      url: https://github.com/Anxcye/flutter_heatmap_calendar
      # Pinned 2026-08-10. See the note on webdav_client above.
      ref: c14e6ebb29c209e318aea36cd715d5001bc26100
  csv: ^6.0.0
  fast_gbk: ^1.0.0
  window_manager: ^0.4.3
  screen_retriever: ^0.2.0
  pretty_dio_logger: ^1.4.0
  dio_intercept_to_curl: ^0.2.0
  gpt_markdown: ^1.1.4
  pointer_interceptor: ^0.10.1+2
  connectivity_plus: ^6.1.3
  http: ^1.3.0
  web_socket_channel: ^3.0.2
  crypto: ^3.0.6
  charset: ^2.0.1
  flutter_slidable: ^4.0.0
  cached_network_image: ^3.4.1
  lpinyin: ^2.0.3
  mongol: ^9.0.0
  introduction_screen: ^3.1.17
  flutter_floating_bottom_bar: ^1.3.0
  skeletonizer: ^2.1.0+1
  scrollable_positioned_list: ^0.3.8
  # share_handler: ^0.0.25
  share_handler:
    git:
      url: https://github.com/Anxcye/share_handler.git
      path: share_handler
      ref: eeaa04d22e7e70babb55b6825b9ca7016e89c89a
  heroine: ^0.5.0+2
  vibration: ^3.1.4
  staggered_reorderable:
    git:
      url: https://github.com/Anxcye/staggered_reorderable.git
      ref: 2ac799a6eeb5da74bf5080a2ba2057272fa52b78
  haptic_feedback: ^0.6.4+2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  custom_lint: ^0.7.5
  riverpod_generator: ^2.4.3
  riverpod_lint: ^2.3.13
  freezed: ^3.0.2
  json_serializable: ^6.9.0
  # Cuts every platform icon from the master files that
  # `tool/generate_app_icons.dart` writes.
  flutter_launcher_icons: ^0.14.3


flutter:
  uses-material-design: true
  generate: true
  shaders:
    - shaders/page_curl.frag
  assets:
    - assets/fonts/SourceHanSerifSC-Regular.otf
    - pubspec.yaml
    - assets/foliate-js/index.html
    - assets/foliate-js/dist/
    - assets/foliate-js/src/
    - assets/foliate-js/src/vendor/
    - assets/foliate-js/src/vendor/pdfjs/
    - assets/foliate-js/src/vendor/prism/
    - assets/foliate-js/src/vendor/prism/components/
    - assets/foliate-js/src/vendor/prism/themes/
    - assets/images/
    - assets/images/book_share/
    - assets/images/bgimg/
    - assets/ornaments/
    - assets/CHANGELOG.md

  fonts:
    - family: Philosopher
      fonts:
        - asset: assets/fonts/Philosopher-Regular.ttf
          weight: 400
        - asset: assets/fonts/Philosopher-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Philosopher-Bold.ttf
          weight: 700
        - asset: assets/fonts/Philosopher-BoldItalic.ttf
          weight: 700
          style: italic
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/SourceSans3-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSans3-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/SourceSans3-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SourceSans3-Bold.ttf
          weight: 700
    - family: SourceHanSerif
      fonts:
        - asset: assets/fonts/SourceHanSerifSC-Regular.otf
          weight: 400
        - asset: assets/fonts/SourceHanSerifSC-Bold.otf
          weight: 700
